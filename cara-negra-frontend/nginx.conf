# Configuración de nginx para servir el build estático de Vite como SPA.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Rutas de React Router: cualquier ruta que no sea un archivo real cae a
    # index.html para que React Router decida qué pantalla mostrar.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # El service worker (sw.js) y el manifest NUNCA deben quedar cacheados por
    # el navegador/proxy: si un despliegue nuevo cambia el shell cacheado y el
    # navegador sigue usando un sw.js viejo, los usuarios quedan "atascados"
    # en una versión anterior de la app sin darse cuenta.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # Los assets versionados por Vite (con hash en el nombre de archivo) sí
    # pueden cachearse agresivamente: un cambio de contenido siempre implica
    # un nombre de archivo distinto.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
